# 本地开发 PostgreSQL，用于对比 Neon 远程库的加载延迟。
# 资料库分块需要 pgvector 的 vector(1536)，因此改用官方 pgvector 镜像。
# 使用前请先启动 Docker Desktop，再执行：pnpm db:local:up
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: xtai-notion-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: xtai
      POSTGRES_PASSWORD: xtai_local_dev
      POSTGRES_DB: xtai_notion
    volumes:
      - xtai_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xtai -d xtai_notion"]
      interval: 3s
      timeout: 5s
      retries: 10

volumes:
  xtai_postgres_data:
